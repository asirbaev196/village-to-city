<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>3D Деревня — управление</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="info">Управляй персонажем кнопками 👇</div>

  <!-- Крестовина -->
  <div id="controls">
    <button class="btn up"    data-dir="up">▲</button>
    <button class="btn left"  data-dir="left">◀</button>
    <button class="btn right" data-dir="right">▶</button>
    <button class="btn down"  data-dir="down">▼</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
