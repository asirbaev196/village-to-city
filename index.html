<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Деревня у Леса и Горы</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1a2e;
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
    user-select:none;
    color:#fff;
    touch-action:none;
  }
  #game { display:block; }

  /* Верхняя панель ресурсов */
  #hud {
    position:fixed; top:0; left:0; right:0;
    background:rgba(20,20,35,0.95);
    padding:8px 10px;
    display:flex; gap:12px; align-items:center;
    border-bottom:2px solid #444;
    font-size:14px;
    z-index:10;
    flex-wrap:wrap;
  }
  .res { display:flex; align-items:center; gap:4px; }
  .res b { color:#ffd93d; }

  /* XP бар */
  #xpBar {
    flex:1; min-width:100px;
    height:16px; background:#333;
    border-radius:8px; overflow:hidden;
    position:relative;
  }
  #xpFill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#4ade80,#22d3ee);
    transition:width 0.3s;
  }
  #xpText {
    position:absolute; width:100%; text-align:center;
    font-size:11px; line-height:16px; font-weight:bold;
    text-shadow:0 0 3px #000;
  }

  /* Нижняя панель */
  #panel {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(20,20,35,0.95);
    padding:8px;
    display:flex; gap:6px; align-items:center;
    border-top:2px solid #444;
    z-index:10;
    flex-wrap:wrap;
    justify-content:center;
  }
  button {
    background:#3b82f6; color:#fff;
    border:none; padding:8px 10px;
    border-radius:6px; cursor:pointer;
    font-size:12px; font-weight:bold;
    transition:transform 0.1s, background 0.2s;
    flex:1; min-width:80px; max-width:120px;
  }
  button:active:not(:disabled) { transform:scale(0.95); }
  button:disabled { background:#444; color:#888; cursor:not-allowed; }
  button.build { background:#22c55e; }

  #hint {
    position:fixed; bottom:60px; left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.9);
    padding:8px 16px; border-radius:8px;
    font-size:13px; opacity:0;
    transition:opacity 0.3s; pointer-events:none;
    z-index:20; text-align:center; width:80%;
  }
  #hint.show { opacity:1; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="res">🪵 <b id="rWood">0</b></div>
  <div class="res">🪨 <b id="rStone">0</b></div>
  <div class="res">🌾 <b id="rFood">0</b></div>
  <div class="res">👥 <b id="rPop">0</b>/<span id="rPopMax">0</span></div>
  <div class="res">⭐ <b id="rLevel">1</b></div>
  <div id="xpBar">
    <div id="xpFill"></div>
    <div id="xpText">0 / 10 XP</div>
  </div>
</div>

<div id="panel">
  <button class="build" id="btnWoodcutter">🪓 Лесопилка</button>
  <button class="build" id="btnQuarry">⛏️ Каменоломня</button>
  <button class="build" id="btnFarm">🌾 Ферма</button>
  <button class="build" id="btnHouse">🏠 Дом</button>
</div>

<div id="hint"></div>

<script>
// ============================================================
// КОНФИГУРАЦИЯ
// ============================================================
const TILE_W = 56;       // Чуть меньше для мобилок
const TILE_H = 28;
const MAP_W = 14;
const MAP_H = 14;

const XP_PER_LEVEL = [0, 10, 25, 50, 90, 150, 250, 400, 600, 900, 1500];

// ============================================================
// СОСТОЯНИЕ ИГРЫ
// ============================================================
const game = {
  wood: 5,
  stone: 0,
  food: 0,
  level: 1,
  xp: 0,
  tiles: [],
  buildings: [],
  nextBuildId: 1,
  camera: { x: 0, y: 0, zoom: 1 },
  lastTick: performance.now(),
};

const T = { EMPTY:'empty', FOREST:'forest', MOUNTAIN:'mountain', FIELD:'field' };

const BUILDINGS = {
  woodcutter: { name:'Лесопилка', emoji:'🪓', cost:{ wood:10, stone:0 }, workers:1, resource:'wood', rate:1, color:'#8b5a2b' },
  quarry: { name:'Каменоломня', emoji:'⛏️', cost:{ wood:0, stone:15 }, workers:1, resource:'stone', rate:1, color:'#6b7280' },
  farm: { name:'Ферма', emoji:'🌾', cost:{ wood:8, stone:5 }, workers:1, resource:'food', rate:1, color:'#ca8a04' },
  house: { name:'Дом', emoji:'🏠', cost:{ wood:12, stone:8 }, workers:0, pop:2, color:'#dc2626' }
};

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  // Центрируем камеру на карте
  const centerX = (MAP_W - 1) / 2;
  const centerY = (MAP_H - 1) / 2;
  game.camera.x = canvas.width / 2;
  game.camera.y = canvas.height / 2 - ((centerX + centerY) * (TILE_H / 2));
}
window.addEventListener('resize', resize);
resize();

function isoToScreen(x, y) {
  return {
    x: (x - y) * (TILE_W / 2) + game.camera.x,
    y: (x + y) * (TILE_H / 2) + game.camera.y
  };
}

function screenToIso(sx, sy) {
  const dx = sx - game.camera.x;
  const dy = sy - game.camera.y;
  return {
    x: Math.floor((dx / (TILE_W/2) + dy / (TILE_H/2)) / 2),
    y: Math.floor((dy / (TILE_H/2) - dx / (TILE_W/2)) / 2)
  };
}

// ============================================================
// ГЕНЕРАЦИЯ И ЗДАНИЯ
// ============================================================
function generateMap() {
  game.tiles = [];
  for (let y = 0; y < MAP_H; y++) {
    game.tiles[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      game.tiles[y][x] = { type: T.EMPTY, building: null };
    }
  }
  // Лес
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      if (Math.random() > 0.2) game.tiles[y][x].type = T.FOREST;
    }
  }
  // Гора
  for (let y = 0; y < 4; y++) {
    for (let x = MAP_W-4; x < MAP_W; x++) {
      if (Math.random() > 0.2) game.tiles[y][x].type = T.MOUNTAIN;
    }
  }
  // Поле
  for (let y = MAP_H-3; y < MAP_H; y++) {
    for (let x = 3; x < MAP_W-3; x++) {
      if (Math.random() > 0.3) game.tiles[y][x].type = T.FIELD;
    }
  }
  // Стартовые домики
  addBuilding('house', 6, 6);
  addBuilding('house', 7, 7);
  addBuilding('house', 5, 7);
  game.buildings.forEach(b => b.spawnScale = 1); // Мгновенно появляются
}

function addBuilding(kind, x, y) {
  const b = { id: game.nextBuildId++, kind, x, y, assigned: 0, spawnScale: 0 };
  game.buildings.push(b);
  game.tiles[y][x].building = b;
}

function tryBuild(kind) {
  const def = BUILDINGS[kind];
  if (game.wood < (def.cost.wood||0) || game.stone < (def.cost.stone||0)) {
    showHint('Недостаточно ресурсов!'); return;
  }
  const spot = findBuildSpot();
  if (!spot) { showHint('Нет места!'); return; }
  
  game.wood -= def.cost.wood || 0;
  game.stone -= def.cost.stone || 0;
  addBuilding(kind, spot.x, spot.y);
  showHint(`Построено: ${def.name}`);
  updateHUD();
}

function findBuildSpot() {
  let best = null, bestDist = Infinity;
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const t = game.tiles[y][x];
      if (t.building || t.type === T.FOREST || t.type === T.MOUNTAIN) continue;
      const d = Math.abs(x - 7) + Math.abs(y - 7);
      if (d < bestDist) { bestDist = d; best = {x, y}; }
    }
  }
  return best;
}

// ============================================================
// РЕНДЕР
// ============================================================
function drawTile(x, y, t) {
  const { x: sx, y: sy } = isoToScreen(x, y);
  
  // Пол
  let floorColor = '#3a5a40';
  if (t.type === T.FIELD) floorColor = '#b8a030';
  if (t.type === T.MOUNTAIN) floorColor = '#555';
  if (t.building) floorColor = '#4a4a5a';

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + TILE_W/2, sy + TILE_H/2);
  ctx.lineTo(sx, sy + TILE_H);
  ctx.lineTo(sx - TILE_W/2, sy + TILE_H/2);
  ctx.closePath();
  ctx.fillStyle = floorColor;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.stroke();

  if (t.type === T.FOREST) drawTree(sx, sy + TILE_H/2);
  if (t.type === T.MOUNTAIN) drawMountain(sx, sy + TILE_H/2);
  if (t.type === T.FIELD && !t.building) drawField(sx, sy + TILE_H/2);
  if (t.building) drawBuilding(t.building, sx, sy + TILE_H/2);
}

function drawTree(sx, sy) {
  ctx.fillStyle = '#4a3520'; ctx.fillRect(sx - 2, sy - 10, 4, 12);
  ctx.beginPath(); ctx.moveTo(sx, sy - 30); ctx.lineTo(sx + 12, sy - 8); ctx.lineTo(sx - 12, sy - 8); ctx.closePath();
  ctx.fillStyle = '#2d6a4f'; ctx.fill();
}

function drawMountain(sx, sy) {
  ctx.beginPath(); ctx.moveTo(sx - 14, sy + 4); ctx.lineTo(sx, sy - 25); ctx.lineTo(sx + 14, sy + 4); ctx.closePath();
  ctx.fillStyle = '#6b7280'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(sx - 6, sy - 12); ctx.lineTo(sx, sy - 25); ctx.lineTo(sx + 6, sy - 12); ctx.closePath();
  ctx.fillStyle = '#e5e7eb'; ctx.fill();
}

function drawField(sx, sy) {
  for (let i = -1; i <= 1; i++) { ctx.fillStyle = '#eab308'; ctx.fillRect(sx + i*6 - 1, sy - 3, 2, 5); }
}

function drawBuilding(b, sx, sy) {
  const def = BUILDINGS[b.kind];
  b.spawnScale = Math.min(1, b.spawnScale + 0.1);
  const s = b.spawnScale;
  const height = (b.kind === 'house' ? 20 : 16) * s;
  const bw = TILE_W * 0.6 * s;

  // Основа
  ctx.fillStyle = def.color;
  ctx.beginPath();
  ctx.moveTo(sx - bw/2, sy - height);
  ctx.lineTo(sx + bw/2, sy - height);
  ctx.lineTo(sx + bw/2, sy);
  ctx.lineTo(sx - bw/2, sy);
  ctx.fill();

  // Крыша
  ctx.fillStyle = '#444'; // Цвет крыши
  ctx.beginPath();
  ctx.moveTo(sx - bw/2 - 2, sy - height);
  ctx.lineTo(sx + bw/2 + 2, sy - height);
  ctx.lineTo(sx, sy - height - 10);
  ctx.fill();

  // Иконка
  ctx.font = `${12*s}px sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(def.emoji, sx, sy - height/2);

  // Жители
  if (b.kind !== 'house') {
    ctx.font = '10px sans-serif'; ctx.fillStyle = b.assigned > 0 ? '#4ade80' : '#888';
    ctx.fillText(`👤${b.assigned}`, sx, sy + 8);
  }
}

function render() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let sum = 0; sum < MAP_W + MAP_H; sum++) {
    for (let y = 0; y < MAP_H; y++) {
      const x = sum - y;
      if (x >= 0 && x < MAP_W) drawTile(x, y, game.tiles[y][x]);
    }
  }
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
function tick(dt) {
  game.buildings.forEach(b => {
    const def = BUILDINGS[b.kind];
    if (def.resource && b.assigned > 0) {
      game[def.resource] += b.assigned * def.rate * dt;
      addXP((b.assigned * def.rate * dt) * 0.5);
    }
  });
  updateHUD();
}

function addXP(n) {
  game.xp += n;
  if (game.level < XP_PER_LEVEL.length - 1 && game.xp >= XP_PER_LEVEL[game.level]) {
    game.level++; game.xp -= XP_PER_LEVEL[game.level - 1];
    showHint(`🎉 Уровень ${game.level}!`);
  }
}

function getMaxPop() { return game.buildings.filter(b => b.kind === 'house').length * 2; }
function getAssigned() { return game.buildings.reduce((sum, b) => sum + b.assigned, 0); }

function assignWorker(b) {
  if (!b || b.kind === 'house' || !BUILDINGS[b.kind].workers) return;
  if (b.assigned >= BUILDINGS[b.kind].workers) {
    b.assigned--; showHint('Снят');
  } else if (getMaxPop() - getAssigned() > 0) {
    b.assigned++; showHint('Назначен');
  } else {
    showHint('Нет свободных!');
  }
  updateHUD();
}

// ============================================================
// UI
// ============================================================
function updateHUD() {
  document.getElementById('rWood').textContent = Math.floor(game.wood);
  document.getElementById('rStone').textContent = Math.floor(game.stone);
  document.getElementById('rFood').textContent = Math.floor(game.food);
  document.getElementById('rPop').textContent = getAssigned();
  document.getElementById('rPopMax').textContent = getMaxPop();
  document.getElementById('rLevel').textContent = game.level;

  const need = XP_PER_LEVEL[game.level] - XP_PER_LEVEL[game.level-1];
  document.getElementById('xpFill').style.width = Math.min(100, (game.xp/need)*100) + '%';
  document.getElementById('xpText').textContent = `${Math.floor(game.xp)} / ${need} XP`;

  document.getElementById('btnWoodcutter').disabled = !(game.wood >= 10);
  document.getElementById('btnQuarry').disabled = !(game.stone >= 15);
  document.getElementById('btnFarm').disabled = !(game.wood >= 8 && game.stone >= 5);
  document.getElementById('btnHouse').disabled = !(game.wood >= 12 && game.stone >= 8);
}

let hintTimeout;
function showHint(text) {
  const el = document.getElementById('hint');
  el.textContent = text; el.classList.add('show');
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => el.classList.remove('show'), 1500);
}

// ============================================================
// УПРАВЛЕНИЕ (ТАПЫ)
// ============================================================
canvas.addEventListener('pointerdown', (e) => {
  const iso = screenToIso(e.clientX, e.clientY);
  if (iso.x < 0 || iso.x >= MAP_W || iso.y < 0 || iso.y >= MAP_H) return;
  const t = game.tiles[iso.y][iso.x];

  if (t.type === T.FOREST && !t.building) {
    if (Math.random() < 0.3) t.type = T.EMPTY;
    game.wood += 1; addXP(1); spawnFloatText(iso.x, iso.y, '+1 🪵');
  } else if (t.type === T.MOUNTAIN && !t.building) {
    game.stone += 1; addXP(1); spawnFloatText(iso.x, iso.y, '+1 🪨');
  } else if (t.type === T.FIELD && !t.building) {
    game.food += 1; addXP(0.5); spawnFloatText(iso.x, iso.y, '+1 🌾');
  } else if (t.building) {
    assignWorker(t.building);
  }
  updateHUD();
});

// Плавающий текст
const floatTexts = [];
function spawnFloatText(x, y, text) {
  const pos = isoToScreen(x, y);
  floatTexts.push({ x: pos.x, y: pos.y, text, life: 1.0 });
}
function renderFloatTexts() {
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.life -= 0.03; f.y -= 1.5;
    if (f.life <= 0) { floatTexts.splice(i, 1); continue; }
    ctx.globalAlpha = f.life; ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1;
  }
}

// Кнопки
document.getElementById('btnWoodcutter').onclick = () => tryBuild('woodcutter');
document.getElementById('btnQuarry').onclick = () => tryBuild('quarry');
document.getElementById('btnFarm').onclick = () => tryBuild('farm');
document.getElementById('btnHouse').onclick = () => tryBuild('house');

// Запуск
generateMap();
updateHUD();

function loop(now) {
  const dt = Math.min((now - game.lastTick) / 1000, 0.1);
  game.lastTick = now;
  if (dt > 0) tick(dt);
  render();
  renderFloatTexts();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
